name: macOS CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and build universal macOS app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Validate release configuration
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          python3 Scripts/check-release.py
          python3 Scripts/generate-project.py
          git diff --exit-code -- Tauross.xcodeproj
          python3 -m unittest discover -s Tests -p '*Tests.py'

      - name: Run unit tests
        run: ./Scripts/test.sh

      - name: Verify update signature rejection cases
        run: ./Scripts/test-updates.sh

      - name: Build universal app
        run: |
          set -o pipefail
          ./Scripts/build.sh Release 2>&1 | tee build-log.txt
          python3 Scripts/check-release.py --app build/DerivedData/Build/Products/Release/Tauross.app

      - name: Package release downloads
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./Scripts/build-release.sh

      - name: Sign and independently verify update feed
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python3 Scripts/create-appcast.py

      - name: Upload verified release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-universal
          path: dist/*
          if-no-files-found: error
          compression-level: 0

      - name: Upload debug symbols
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tauross-debug-symbols
          path: build/DerivedData/Build/Products/Release/Tauross.app.dSYM
          if-no-files-found: error
          retention-days: 90

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-failure-logs
          path: '*-log.txt'
          if-no-files-found: ignore

  release:
    name: Publish verified release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: macos-universal
          path: dist

      - name: Check asset checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Tauross $RELEASE_TAG" --notes-file "release-notes/$RELEASE_TAG.md"
          fi
          DRAFT=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
          if [ "$DRAFT" = true ]; then
            gh release upload "$RELEASE_TAG" dist/*.zip dist/*.dmg dist/appcast.xml dist/SHA256SUMS.txt --clobber
            gh release edit "$RELEASE_TAG" --draft=false --latest
          else
            echo 'Release is already published; immutable assets are unchanged.'
          fi
